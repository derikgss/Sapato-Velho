<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Produto - Sapato Velho</title>
<link rel="icon" href="logo/apenaslogo.png" sizes="512x512" type="imagem/png">
<style>


*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#050505;
    color:#fff;
}

.container{
    max-width:1200px;
    margin:auto;
    min-height:100vh;
    border-left:1px solid #fff;
    border-right:1px solid #fff;
}


header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 25px;
    border-bottom:1px solid #251403;
    flex-wrap:wrap;
    gap:15px;
    box-shadow:0 2px 15px rgba(0,0,0,0.4);
    background:#6b4521
    
    
}

.logo{
    display:flex;
    align-items:center;
    width:75px;
    flex-shrink:0;
}

.logo img{
    width:100%;
    height:auto;
    object-fit:contain;
}

.search{
    display:flex;
    align-items:center;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:30px;
    overflow:hidden;
    backdrop-filter:blur(6px);
    transition:0.3s;
}

.search input{
    width:220px;
    padding:12px 18px;
    border:none;
    outline:none;
    background:transparent;
    color:#fff;
    font-size:15px;
}

.search input::placeholder{
    color:#ffffff34;
}

.search button{
    width:40px;
    height:40px;
    border:none;
    border-left:1px solid #fff;
    background:transparent;
    color:#fff;
    cursor:pointer;
}

nav{
    display:flex;
    align-items:center;
    gap:30px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
    text-align:center;
}

.login-btn{
    border:1px solid #fff;
    padding:12px 22px;
}

.product-page{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:80px;
    padding:80px 40px;
}

.gallery{
    display:flex;
    flex-direction:column;
}

.main-image{
    width:100%;
    max-width:420px;
    height:420px;
    border:1px solid #fff;
    border-radius:35px;
    overflow:hidden;
    margin-bottom:25px;
}

.main-image img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.thumbnails{
    display:flex;
    gap:20px;
}

.thumb{
    width:80px;
    height:80px;
    border:1px solid #fff;
    border-radius:12px;
    overflow:hidden;
    cursor:pointer;
    background:transparent;
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    font-weight:bold;
}

.thumb img{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* PRODUCT INFO */
.product-info{
    display:flex;
    flex-direction:column;
    justify-content:flex-start;
    padding-top:20px;
}

.product-info h1{
    font-size:62px;
    margin-bottom:40px;
}

.description{
    font-size:22px;
    line-height:1.5;
    max-width:400px;
    margin-bottom:60px;
    color:#ddd;
}

.price{
    font-size:54px;
    font-weight:bold;
    margin-bottom:40px;
}

/* BUTTON */
.buy-button{
    width:240px;
    height:80px;
    border:1px solid #fff;
    background:transparent;
    color:#fff;
    font-size:24px;
    border-radius:18px;
    cursor:pointer;
    transition:0.3s;
}

.buy-button:hover{
    background:#fff;
    color:#000;
}

@media (max-width:900px){

header{
    flex-direction:column;
}

.search{
    width:100%;
}

.search input{
    width:100%;
}

nav{
    width:100%;
    justify-content:space-between;
    gap:10px;
}

.product-page{
    grid-template-columns:1fr;
    gap:50px;
    padding:50px 25px;
}

.main-image{
    height:320px;
    margin:auto;
    margin-bottom:20px;
}

.thumbnails{
    justify-content:center;
}

.product-info{
    text-align:center;
    align-items:center;
    padding-top:0;
}

.product-info h1{
    font-size:42px;
}

.description{
    font-size:18px;
}

.price{
    font-size:42px;
}

.buy-button{
    width:100%;
    max-width:280px;
}

}

</style>
</head>

<script>
function adicionarCarrinho(nome, preco, imagem){

    let carrinho = JSON.parse(localStorage.getItem("carrinho")) || [];

    carrinho.push({
        nome: nome,
        preco: preco,
        imagem: imagem
    });

    localStorage.setItem("carrinho", JSON.stringify(carrinho));

    alert(nome + " adicionado ao carrinho!");
}
</script>

<body>

<div class="container">

<header>

    <a href="main.html" class="logo">
        <img src="logo/apenaslogo.png" alt="logocompleta">
</a>

    <div class="search">

        <input type="text" placeholder="Pesquisar">

        <a href="produtos.html">
            <button>⌕</button>
        </a>
    </div>

    <nav>
        <a href="faleconosco.html">Fale<br>Conosco</a>
        <a href="sobre.html">Sobre<br>nós</a>
        <a href="login.html" class="login-btn">Entrar</a>
        <a href="carrinho.html" class="carrinho">
        <img src="logo/carrinho.png" width="65"> </a>
    </nav>

</header>

<section class="product-page">


<div class="gallery">

    <div class="main-image">
        <img src="ProdutosImagens/snes.jpeg" alt="Console SNES">
    </div>

    <div class="thumbnails">

        <div class="thumb">
            <img src="ProdutosImagens/snes.jpeg" alt="">
        </div>

        <div class="thumb">
            <img src="ProdutosImagens/snes1.jpeg">
        </div>

        <div class="thumb">
             <img src="ProdutosImagens/snes2.png">
        </div>

    </div>

</div>


<div class="product-info">

    <h1>Console SNES</h1>

    <p class="description">
        Funcionando, com 1 controle,
        fonte e cabo AV. Não acompanha jogos.
    </p>

    <div class="price">
        R$ 300
    </div>

    <button class="add-cart"
    onclick="adicionarCarrinho(
    'Console SNES',
    300,
    'ProdutosImagens/snes.jpeg'
    )">
    Adicionar ao carrinho
</button>
</div>

</section>

</div>

</body>
</html>
