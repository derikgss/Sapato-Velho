<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Painel admin - Sapato Velho</title>
<link rel="icon" href="img/layout/apenaslogo.png" sizes="512x512" type="image/png">
<link rel="stylesheet" href="css/style.css">
<style>
.page-cadastro .aviso{max-width:900px;margin:0 auto 30px;text-align:center;font-size:18px}
.page-cadastro .aviso a{color:#fff}
.page-cadastro .aviso.erro{border:1px solid #fff;padding:14px}
.page-cadastro select{height:42px;border:1px solid #fff;background:#050505;color:#fff;padding:0 10px}
.page-cadastro .form-group input[type=number]{width:100%}
.page-cadastro .abas{display:flex;justify-content:center;gap:14px;margin-bottom:40px}
.page-cadastro .abas button,.page-cadastro .tabela button,.page-cadastro .barra a{padding:10px 18px;border:1px solid #fff;background:transparent;color:#fff;cursor:pointer;font-size:15px;border-radius:8px;transition:.3s;text-decoration:none}
.page-cadastro .abas button.ativa,.page-cadastro .abas button:hover,.page-cadastro .tabela button:hover,.page-cadastro .barra a:hover{background:#fff;color:#000}
.page-cadastro .barra{max-width:900px;margin:0 auto 25px;display:flex;justify-content:flex-end}
.page-cadastro .tabela{width:100%;max-width:900px;margin:0 auto;border-collapse:collapse}
.page-cadastro .tabela th,.page-cadastro .tabela td{border-bottom:1px solid #444;padding:12px 8px;text-align:left;font-size:15px}
.page-cadastro .tabela input{width:90px;height:34px;border:1px solid #fff;background:transparent;color:#fff;padding:4px 8px}
.page-cadastro .tabela img{width:42px;height:42px;object-fit:cover;vertical-align:middle;margin-right:10px}
.page-cadastro .previa{max-width:160px;max-height:160px;margin-top:10px;display:none}
.page-cadastro .dica{font-size:14px;color:#bbb}
.page-cadastro .tabela-rolagem{overflow-x:auto}
@media(max-width:700px){.page-cadastro main{padding:40px 16px}.page-cadastro .page-title{font-size:38px;margin-bottom:40px}.page-cadastro .form-grid{grid-template-columns:1fr;gap:35px}}
</style>
</head>
<body class="page-cadastro" data-theme="dark">
<div class="container">
<header>
<a href="main.html" class="logo"><img src="img/layout/apenaslogo.png" alt="logocompleta"></a>
<div class="search">
    <input type="text" placeholder="Pesquisar">
    <a href="produtos.html"><button>⌕</button></a>
</div>
<nav>
    <a href="faleconosco.html">Fale<br>Conosco</a>
    <a href="sobre.html">Sobre<br>nós</a>
    <a href="login.html" class="login-btn">Entrar</a>
    <a href="carrinho.html" class="carrinho carrinho-indicador">
        <img id="imagemCarrinho" src="img/layout/carrinho.png" data-vazio="img/layout/carrinho.png" data-cheio="img/layout/carrinho-cheio.png" width="65" alt="Carrinho vazio">
        <span id="contadorCarrinho" class="contador-carrinho">0</span>
    </a>
</nav>
</header>
<main>
<h1 class="page-title">Painel admin</h1>
<p id="aviso" class="aviso" hidden></p>
<section id="painel" hidden>
 <div class="abas">
  <button type="button" id="abaProdutos" class="ativa">Produtos</button>
  <button type="button" id="abaUsuarios">Usuários</button>
 </div>

 <div id="secProdutos">
  <div class="barra"><a href="cadastrar-produto.html">Cadastrar produto</a></div>
  <div class="tabela-rolagem"><table class="tabela">
   <thead><tr><th>Produto</th><th>Preço (R$)</th><th>Estoque</th><th></th></tr></thead>
   <tbody id="listaProdutos"></tbody>
  </table></div>
 </div>

 <div id="secUsuarios" hidden>
  <div class="tabela-rolagem"><table class="tabela">
   <thead><tr><th>Nome</th><th>E-mail</th><th>Cidade</th><th>Cargo</th><th></th></tr></thead>
   <tbody id="listaUsuarios"></tbody>
  </table></div>
 </div>
</section>
</main>
</div>
<script src="js/api.js"></script>
<script src="js/carrinho.js"></script>
<script>
function cargoAtual() {
    const dados = dadosDoToken(lerToken() || "") || {};
    return dados.role || dados["http://schemas.microsoft.com/ws/2008/06/identity/claims/role"] || (lerUsuario() || {}).cargo || "";
}
const cargo = cargoAtual();
const ehAdmin = cargo === "Admin";
const aviso = document.getElementById("aviso");
const painel = document.getElementById("painel");

function mostrarAba(nome) {
    const produtos = nome === "produtos";
    document.getElementById("secProdutos").hidden = !produtos;
    document.getElementById("secUsuarios").hidden = produtos;
    document.getElementById("abaProdutos").classList.toggle("ativa", produtos);
    document.getElementById("abaUsuarios").classList.toggle("ativa", !produtos);
    if (!produtos) carregarUsuarios();
}

async function carregarProdutos() {
    const corpo = document.getElementById("listaProdutos");
    try {
        const lista = await api("/produtos");
        if (!lista.length) { corpo.innerHTML = '<tr><td colspan="4">Nenhum produto cadastrado ainda.</td></tr>'; return; }
        corpo.innerHTML = lista.map(p => '<tr data-id="' + p.id + '">' +
            '<td><img src="' + escaparHtml(p.imagem) + '" alt="">' + escaparHtml(p.nome) + '</td>' +
            '<td><input type="number" step="0.01" min="0.01" value="' + p.preco + '" data-campo="preco"></td>' +
            '<td><input type="number" step="1" min="0" value="' + p.estoque + '" data-campo="estoque"></td>' +
            '<td><button type="button" data-acao="salvar">Salvar</button> <button type="button" data-acao="excluir">Excluir</button></td></tr>').join("");
        corpo._produtos = lista;
    } catch (erro) {
        corpo.innerHTML = '<tr><td colspan="4">' + escaparHtml(erro.message) + '</td></tr>';
    }
}

document.getElementById("listaProdutos").addEventListener("click", async function (e) {
    const botao = e.target.closest("button[data-acao]");
    if (!botao) return;
    const linha = botao.closest("tr");
    const produto = this._produtos.find(p => p.id === Number(linha.dataset.id));
    try {
        if (botao.dataset.acao === "salvar") {
            await api("/produtos/" + produto.id, { method: "PUT", body: {
                nome: produto.nome, imagem: produto.imagem,
                preco: Number(linha.querySelector('[data-campo="preco"]').value),
                estoque: parseInt(linha.querySelector('[data-campo="estoque"]').value, 10)
            }});
            alert("Produto atualizado.");
        } else if (confirm('Excluir "' + produto.nome + '"?')) {
            await api("/produtos/" + produto.id, { method: "DELETE" });
            carregarProdutos();
        }
    } catch (erro) { alert(erro.message); }
});

async function carregarUsuarios() {
    const corpo = document.getElementById("listaUsuarios");
    try {
        const lista = await api("/usuarios");
        const cargos = { 1: "Admin", 2: "Funcionario", 3: "Cliente" };
        corpo.innerHTML = lista.map(u => '<tr data-id="' + u.id + '">' +
            '<td>' + escaparHtml(u.nome) + '</td><td>' + escaparHtml(u.email) + '</td><td>' + escaparHtml(u.cidade || "") + '</td>' +
            '<td><select ' + (ehAdmin ? "" : "disabled") + '>' + Object.entries(cargos).map(([id, nome]) =>
                '<option value="' + id + '"' + (Number(id) === u.cargoId ? " selected" : "") + '>' + nome + '</option>').join("") + '</select></td>' +
            '<td>' + (ehAdmin ? '<button type="button">Salvar</button>' : "") + '</td></tr>').join("");
    } catch (erro) {
        corpo.innerHTML = '<tr><td colspan="5">' + escaparHtml(erro.message) + '</td></tr>';
    }
}

document.getElementById("listaUsuarios").addEventListener("click", async function (e) {
    const botao = e.target.closest("button");
    if (!botao) return;
    const linha = botao.closest("tr");
    try {
        await api("/usuarios/" + linha.dataset.id + "/cargo", { method: "PUT", body: { cargoId: Number(linha.querySelector("select").value) } });
        alert("Cargo atualizado. A pessoa precisa sair e entrar de novo para valer.");
    } catch (erro) { alert(erro.message); }
});

document.getElementById("abaProdutos").addEventListener("click", () => mostrarAba("produtos"));
document.getElementById("abaUsuarios").addEventListener("click", () => mostrarAba("usuarios"));

if (!estaLogado()) {
    aviso.hidden = false;
    aviso.innerHTML = 'Entre com uma conta de administrador para ver este painel. <a href="login.html">Ir para o login</a>';
} else if (!["Admin", "Funcionario"].includes(cargo)) {
    aviso.hidden = false;
    aviso.classList.add("erro");
    aviso.textContent = "Sua conta não tem permissão para acessar o painel.";
} else {
    painel.hidden = false;
    carregarProdutos();
}
</script>
</body>
</html>
