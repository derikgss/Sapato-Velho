<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Criar Conta - Sapato Velho</title>
<link rel="icon" href="../img/layout/apenaslogo.png" sizes="512x512" type="imagem/png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="page-cadastro" data-theme="dark">
    <div class="container">
<header>
<a href="main.html" class="logo">
<img src="img/layout/apenaslogo.png" alt="logocompleta">
</a>
    <div class="search">


        <input type="text" placeholder="Pesquisar">


        <a href="produtos.html">
            <button>⌕</button>
        </a>
    </div>


    <nav>
        <a href="faleconosco.html">Fale<br>Conosco</a>
        <a href="sobre.html">Sobre<br>nós</a>
        <a href="login.html" class="login-btn">Entrar</a>
        <a href="carrinho.html" class="carrinho carrinho-indicador">
        <img id="imagemCarrinho"
             src="img/layout/carrinho.png"
             data-vazio="img/layout/carrinho.png"
             data-cheio="img/layout/carrinho-cheio.png"
             width="65"
             alt="Carrinho vazio">
        <span id="contadorCarrinho" class="contador-carrinho">0</span>
    </a>
    </nav>


</header>
<main>
<h1 class="page-title">Criar conta</h1>
<form id="formCadastro">
 <div class="form-grid">
   
    <div class="form-column">


        <div class="form-group">
            <label>Nome</label>
            <input type="text" id="Nome" name="Nome" required><br><br>
        </div>


        <div class="form-group">
            <label>Data de nascimento</label>
            <input type="date" id="Datadenascimento" name="Datadenascimento" required><br><br>
        </div>


        <div class="form-group">
            <label>CPF</label>
            <input type="text" id="CPF" name="CPF" required><br><br>
        </div>
       
        <div class="form-group">
            <label>E-mail</label>
            <input type="email" id="Email" name="Email" required><br><br>
        </div>
       
        <div class="form-group">
            <label>Senha</label>
            <input type="password" minlength="6" id="Senha" name="Senha" required><br><br>
        </div>


    </div>


   
    <div class="form-column">


        <div class="form-group">
            <label>Endereço</label>
            <input type="text" id="Endereco" name="Endereco" required><br><br>
        </div>


        <div class="form-group">
            <label>CEP</label>
            <input type="text" id="CEP" name="CEP" required><br><br>
        </div>


        <div class="form-group">
            <label>Cidade</label>
            <input type="text" id="Cidade" name="Cidade" required><br><br>
        </div>


    </div>


 </div>


 <div class="button-area">
    <button type="submit">Criar conta</button>
 </div>


</form>
</main>
</div>
<script src="js/api.js"></script>
<script src="js/carrinho.js"></script>
<script>
document.getElementById("formCadastro").addEventListener("submit", async function(e){

    e.preventDefault();

    const valor = id => document.getElementById(id).value.trim();

    const dados = {
        nome: valor("Nome"),
        dataNascimento: valor("Datadenascimento") || null,
        cpf: valor("CPF"),
        email: valor("Email"),
        senha: document.getElementById("Senha").value,
        endereco: valor("Endereco"),
        cep: valor("CEP"),
        cidade: valor("Cidade")
    };

    try{

        await api("/usuarios/cadastro", { method: "POST", body: dados });

        alert("Conta criada com sucesso! Agora é só entrar.");
        window.location.href = "login.html";

    }catch(erro){

        alert(erro.message);

    }

});
</script>
</body>
</html>
