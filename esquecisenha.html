<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esqueci minha senha - Sapato Velho</title>
<link rel="icon" href="logo/apenaslogo.png" sizes="512x512" type="imagem/png">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#050505;
    color:#fff;
}


.container{
    max-width:1200px;
    margin:auto;
    min-height:100vh;
    border-left:1px solid #fff;
    border-right:1px solid #fff;
}


header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 25px;
    border-bottom:1px solid #251403;
    flex-wrap:wrap;
    gap:15px;
    box-shadow:0 2px 15px rgba(0,0,0,0.4);
    background:#6b4521
    
    
}

.logo{
    display:flex;
    align-items:center;
    width:75px;
    flex-shrink:0;
}

.logo img{
    width:100%;
    height:auto;
    object-fit:contain;
}

.search{
    display:flex;
    align-items:center;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:30px;
    overflow:hidden;
    backdrop-filter:blur(6px);
    transition:0.3s;
}

.search input{
    width:220px;
    padding:12px 18px;
    border:none;
    outline:none;
    background:transparent;
    color:#fff;
    font-size:15px;
}

.search input::placeholder{
    color:#ffffff34;
}

.search button{
    width:40px;
    height:40px;
    border:none;
    border-left:1px solid #fff;
    background:transparent;
    color:#fff;
    cursor:pointer;
}


nav{
    display:flex;
    align-items:center;
    gap:30px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
    text-align:center;
}

.login-btn{
    border:1px solid #fff;
    padding:12px 22px;
}


main{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    min-height:80vh;
    padding:90px 25px;
}


.recovery-box{
    width:100%;
    max-width:460px;
}


.recovery-box h1{
    font-size:58px;
    line-height:1.1;
    margin-bottom:30px;
}


.description{
    font-size:18px;
    line-height:1.6;
    margin-bottom:60px;
    color:#ddd;
}

.form-group{
    margin-bottom:35px;
}

.form-group label{
    display:block;
    text-align:center;
    margin-bottom:14px;
    font-size:18px;
}

.form-group input{
    width:100%;
    height:45px;
    border:1px solid #fff;
    background:transparent;
    color:#fff;
    padding:10px;
    outline:none;
}


.button-area{
    display:flex;
    justify-content:center;
}

.button-area button{
    padding:14px 30px;
    border:1px solid #fff;
    background:transparent;
    color:#fff;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
    font-size:16px;
}

.button-area button:hover{
    background:#fff;
    color:#000;
}


@media (max-width:768px){

header{
    flex-direction:column;
}

.search{
    width:100%;
}

.search input{
    width:100%;
}

nav{
    width:100%;
    justify-content:space-between;
    gap:10px;
}

.recovery-box h1{
    font-size:42px;
}

.description{
    font-size:16px;
}

main{
    padding:60px 25px;
}

}

</style>
</head>

<body>

<div class="container">

<header>
<a href="main.html" class="logo">
        <img src="logo/apenaslogo.png" alt="logocompleta">
</a>

    <div class="search">

        <input type="text" placeholder="Pesquisar">

        <a href="produtos.html">
            <button>⌕</button>
        </a>
    </div>

    <nav>
        <a href="faleconosco.html">Fale<br>Conosco</a>
        <a href="sobre.html">Sobre<br>nós</a>
        <a href="login.html"class="login-btn">Entrar</a>
        <a href="carrinho.html" class="carrinho">
        <img src="logo/carrinho.png" width="65"> </a>
    </nav>

</header>

<main>

<div class="recovery-box">

    <h1>Esqueci minha senha</h1>

    <p class="description">
        Insira seu e-mail, que iremos auxiliar
        com a recuperação de sua senha.
    </p>

    <div class="form-group">
        <label>E-mail</label>
        <input type="email">
    </div>

    <div class="button-area">
        <button>Enviar</button>
    </div>

</div>

</main>

</div>

</body>
</html>
