<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Carrinho - Sapato Velho</title>
<link rel="icon" href="logo/apenaslogo.png" sizes="512x512" type="imagem/png">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#050505;
    color:#fff;
}

.container{
    max-width:1200px;
    margin:auto;
    min-height:100vh;
    border-left:1px solid #fff;
    border-right:1px solid #fff;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 25px;
    border-bottom:1px solid #251403;
    flex-wrap:wrap;
    gap:15px;
    box-shadow:0 2px 15px rgba(0,0,0,0.4);
    background:#6b4521
    
    
}

.logo{
    display:flex;
    align-items:center;
    width:75px;
    flex-shrink:0;
}

.logo img{
    width:100%;
    height:auto;
    object-fit:contain;
}

.search{
    display:flex;
    align-items:center;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:30px;
    overflow:hidden;
    backdrop-filter:blur(6px);
    transition:0.3s;
}

.search input{
    width:220px;
    padding:12px 18px;
    border:none;
    outline:none;
    background:transparent;
    color:#fff;
    font-size:15px;
}

.search input::placeholder{
    color:#ffffff34;
}

.search button{
    width:40px;
    height:40px;
    border:none;
    border-left:1px solid #fff;
    background:transparent;
    color:#fff;
    cursor:pointer;
}

nav{
    display:flex;
    align-items:center;
    gap:20px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
    text-align:center;
}

.login-btn{
    border:1px solid #fff;
    padding:10px 18px;
}

.carrinho{
    font-size:28px;
}

/* LAYOUT */

.cart-layout{
    display:grid;
    grid-template-columns:1fr 350px;
    gap:30px;
    padding:40px 25px;
}

/* ITENS */

.cart-items{
    border:1px solid #fff;
    padding:30px;
}

.cart-items h1{
    font-size:42px;
    margin-bottom:30px;
}

.item{
    display:flex;
    gap:20px;
    align-items:center;
    padding:20px 0;
    border-bottom:1px solid #333;
}

.item img{
    width:120px;
    height:120px;
    object-fit:cover;
    border:1px solid #fff;
}

.info{
    flex:1;
}

.info h2{
    margin-bottom:10px;
    font-size:22px;
}

.info p{
    color:#ccc;
}

.remove{
    padding:12px 18px;
    border:1px solid #fff;
    background:transparent;
    color:#fff;
    cursor:pointer;
    transition:0.3s;
}

.remove:hover{
    background:#fff;
    color:#000;
}

/* RESUMO */

.cart-summary{
    border:1px solid #fff;
    padding:30px;
    height:fit-content;
    position:sticky;
    top:30px;
}

.cart-summary h2{
    font-size:34px;
    margin-bottom:30px;
}

.summary-line{
    display:flex;
    justify-content:space-between;
    margin-bottom:18px;
    font-size:18px;
}

.total{
    border-top:1px solid #fff;
    padding-top:20px;
    margin-top:20px;
    font-size:28px;
    font-weight:bold;
}

.finish-btn{
    width:100%;
    height:55px;
    margin-top:30px;
    border:1px solid #fff;
    background:transparent;
    color:#fff;
    font-size:17px;
    cursor:pointer;
    transition:0.3s;
}

.finish-btn:hover{
    background:#fff;
    color:#000;
}

.empty{
    text-align:center;
    color:#aaa;
    padding:40px 0;
}
footer{
    padding:40px 25px;
    border-top:1px solid #fff;
    text-align:center;
    color:#ccc;
}

.rodape{
    background:#362210;
    color:#fff;
}
@media(max-width:900px){

header{
    flex-direction:column;
}

.search{
    width:100%;
}

.search input{
    width:100%;
}

nav{
    width:100%;
    justify-content:space-between;
}

.cart-layout{
    grid-template-columns:1fr;
}

.cart-summary{
    position:static;
}

.cart-items h1{
    font-size:34px;
}
.rodape{
    background:#362210;
    color:#fff;
}

}

</style>
</head>

<body>

<div class="container">

<header>

<a href="main.html" class="logo">
    <img src="logo/apenaslogo.png" alt="Logo">
</a>

<div class="search">

    <input type="text" placeholder="Pesquisar">

    <button>⌕</button>

</div>

<nav>

    <a href="faleconosco.html">
        Fale<br>Conosco
    </a>

    <a href="sobre.html">
        Sobre<br>Nós
    </a>

    <a href="login.html" class="login-btn">
        Entrar
    </a>

    <a href="carrinho.html" class="carrinho">
        <img src="logo/carrinho.png" width="65">
    </a>

</nav>

</header>

<section class="cart-layout">

<!-- PRODUTOS -->

<div class="cart-items">

    <h1>Seu Carrinho</h1>

    <div id="lista"></div>

</div>

<div class="cart-summary">

    <h2>Resumo</h2>

    <div class="summary-line">
        <span>Subtotal</span>
        <span id="subtotal">R$ 0</span>
    </div>

    <div class="summary-line total">
        <span>Total</span>
        <span id="total">R$ 0</span>
    </div>

    <a href="checkout.html">

        <button class="finish-btn">
            Finalizar Pedido
        </button>

    </a>

</div>

</section>

<footer class="rodape">

    natan.maxwell@gmail.com

    <br><br>

    © 2026 Todos os direitos reservados.

</footer>

</div>

<script>



let carrinho =
JSON.parse(localStorage.getItem("carrinho")) || [];

let lista =
document.getElementById("lista");

let subtotal = 0;

function carregarCarrinho(){

    lista.innerHTML = "";

    subtotal = 0;



    if(carrinho.length === 0){

        lista.innerHTML = `

        <div class="empty">

            <h2>Seu carrinho está vazio 🛒</h2>

        </div>

        `;

    }



    carrinho.forEach((produto,index)=>{

        subtotal += produto.preco;

        lista.innerHTML += `

        <div class="item">

            <img src="${produto.imagem}" alt="${produto.nome}">

            <div class="info">

                <h2>${produto.nome}</h2>

                <p>R$ ${produto.preco}</p>

            </div>

            <button class="remove"
            onclick="removerProduto(${index})">

                Remover

            </button>

        </div>

        `;

    });



    document.getElementById("subtotal")
    .innerHTML =
    "R$ " + subtotal.toFixed(2);



    document.getElementById("total")
    .innerHTML =
    "R$ " + (subtotal).toFixed(2);

}

function removerProduto(index){

    carrinho.splice(index,1);

    localStorage.setItem(
        "carrinho",
        JSON.stringify(carrinho)
    );

    carregarCarrinho();

}

carregarCarrinho();

</script>

</body>
</html>
