<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entrar - Sapato Velho</title>
<link rel="icon" href="logo/apenaslogo.png" sizes="512x512" type="imagem/png">
<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#050505;
    color:#fff;
}

.container{
    max-width:1200px;
    margin:auto;
    min-height:100vh;
    border-left:1px solid #fff;
    border-right:1px solid #fff;
}

header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:20px 25px;
    border-bottom:1px solid #251403;
    flex-wrap:wrap;
    gap:15px;
    box-shadow:0 2px 15px rgba(0,0,0,0.4);
    background:#6b4521
    
    
}

.logo{
    display:flex;
    align-items:center;
    width:75px;
    flex-shrink:0;
}

.logo img{
    width:100%;
    height:auto;
    object-fit:contain;
}

.search{
    display:flex;
    align-items:center;
    background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:30px;
    overflow:hidden;
    backdrop-filter:blur(6px);
    transition:0.3s;
}

.search input{
    width:220px;
    padding:12px 18px;
    border:none;
    outline:none;
    background:transparent;
    color:#fff;
    font-size:15px;
}

.search input::placeholder{
    color:#ffffff34;
}

.search button{
    width:40px;
    height:40px;
    border:none;
    border-left:1px solid #fff;
    background:transparent;
    color:#fff;
    cursor:pointer;
}

nav{
    display:flex;
    align-items:center;
    gap:20px;
}

nav a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
    text-align:center;
}

.login-btn{
    border:1px solid #fff;
    padding:10px 18px;
}

main{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:80vh;
    padding:50px 25px;
}

.login-box{
    width:100%;
    max-width:420px;
    border:1px solid #fff;
    padding:45px;
}

.login-box h1{
    font-size:54px;
    margin-bottom:45px;
    line-height:1.1;
    text-align:center;
}

.form-group{
    margin-bottom:25px;
}

.form-group label{
    display:block;
    margin-bottom:10px;
    font-size:15px;
}

.form-group input{
    width:100%;
    height:50px;
    padding:12px;
    border:1px solid #fff;
    background:transparent;
    color:#fff;
    outline:none;
}

.login-button{
    width:100%;
    padding:16px;
    border:1px solid #fff;
    background:transparent;
    color:#fff;
    cursor:pointer;
    font-size:16px;
    transition:0.3s;
}

.login-button:hover{
    background:#fff;
    color:#000;
}

.links{
    display:flex;
    justify-content:space-between;
    margin-top:30px;
    gap:20px;
}

.links a{
    color:#fff;
    text-decoration:none;
    font-size:14px;
}

.links a:hover{
    text-decoration:underline;
}

footer{
    padding:40px 25px;
    border-top:1px solid #fff;
    text-align:center;
    color:#ccc;
}

.rodape{
    background:#362210;
    color:#fff;
}

@media (max-width:900px){

header{
    flex-direction:column;
}

.search{
    width:100%;
}

.search input{
    width:100%;
}

nav{
    width:100%;
    justify-content:space-between;
}

.login-box{
    padding:35px 25px;
}

.login-box h1{
    font-size:42px;
}

.links{
    flex-direction:column;
    align-items:center;
}
.rodape{
    background:#362210;
    color:#fff;
}

}

</style>
</head>

<script>
function login(){

    let email = document.getElementById("email").value;
    let senha = document.getElementById("senha").value;

    let usuario = JSON.parse(localStorage.getItem("usuario"));

    if(usuario == null){

        alert("Nenhum Usuario encontrado");
        return;

    }

    if(email == usuario.email && senha == usuario.senha){

        localStorage.setItem("logado", "true");

        alert("Sucesso no login!");

         window.location.href = "main.html";

    }else{

        alert("Email ou senha incorretos!");

    }

}
</script>

<body>

<div class="container">

<header>

<a href="main.html" class="logo">
        <img src="logo/apenaslogo.png" alt="logocompleta">
</a>

    <div class="search">

        <input type="text" placeholder="Pesquisar">

        <button onclick="window.location.href='produtos.html'">
            ⌕
        </button>

    </div>

    <nav>
        <a href="faleconosco.html">Fale<br>Conosco</a>
        <a href="sobre.html">Sobre<br>nós</a>
        <a href="login.html" class="login-btn">Entrar</a>
        <a href="carrinho.html" class="carrinho">
        <img src="logo/carrinho.png" width="65"> </a>
    </nav>

</header>

<main>

<div class="login-box">

    <h1>
        Entre ou<br>
        cadastre-se
    </h1>

    <div class="form-group">

        <label>Login</label>

        <input type="email" id="email">

    </div>

    <div class="form-group">

        <label>Senha</label>

        <input type="password" id="senha">

    </div>

    <button class="login-button" onclick="login()">
        ENTRAR
    </button>

    <div class="links">

        <a href="esquecisenha.html">
            Esqueci minha senha
        </a>

        <a href="cadastro.html">
            Criar conta
        </a>

    </div>

</div>

</main>

<footer class="rodape">
    natan.maxwell@gmail.com
    <br><br>
    © 2026 Todos os direitos reservados.
</footer>

</div>

</body>
</html>
